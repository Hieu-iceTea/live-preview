    <style>
        body {

            background-color: #f0f2f5;
        }

        .group-card, .master-card, .ai-card {
            transition: all 0.3s ease;
        }

        .group-card:hover, .master-card:hover, .ai-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .btn {
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        #ai-modal {
            display: none;
            /* Hidden by default */
        }

    // --- CÁC HÀM RENDER DỮ LIỆU ---

        else { data.forEach(item => { tableBody.innerHTML += `<tr class="bg-white border-b hover:bg-gray-50"><td class="py-4 px-6 font-medium text-gray-900 whitespace-nowrap">${item['Họ tên']}</td><td class="py-4 px-6">${item['Email']}</td><td class="py-4 px-6">${item['Dự án']}</td><td class="py-4 px-6 font-semibold">Group ${item['Group']}</td></tr>`; }); }
        countSpan.textContent = `(${data.length} TV)`;
    }

    function renderGroupTable(groupNum, data) {
        const tableBody = document.getElementById(`table-body-${groupNum}`);

        else { data.forEach(item => { tableBody.innerHTML += `<tr class="bg-white border-b hover:bg-gray-50"><td class="py-4 px-6 font-medium text-gray-900 whitespace-nowrap">${item['Họ tên']}</td><td class="py-4 px-6">${item['Email']}</td><td class="py-4 px-6">${item['Dự án']}</td></tr>`; }); }

    // --- CÁC HÀM LỌC DỮ LIỆU ---
    function applyMasterFilters() {
        const searchTerm = document.getElementById('search-master').value.toLowerCase();
        const selectedProject = document.getElementById('project-filter-master').value;
        const selectedGroup = document.getElementById('group-filter-master').value;
        filteredAllData = allData.filter(item => (item['Họ tên'].toLowerCase().includes(searchTerm) || item['Email'].toLowerCase().includes(searchTerm)) && (selectedProject === 'all' || item['Dự án'] === selectedProject) && (selectedGroup === 'all' || item['Group'] == selectedGroup));
        renderMasterTable(filteredAllData);
    }

    function applyGroupFilters(groupNum, originalData) {
        const searchTerm = document.getElementById(`search-${groupNum}`).value.toLowerCase();
        const selectedProject = document.getElementById(`project-filter-${groupNum}`).value;
        let filteredData = originalData.filter(item => (item['Họ tên'].toLowerCase().includes(searchTerm) || item['Email'].toLowerCase().includes(searchTerm)) && (selectedProject === 'all' || item['Dự án'] === selectedProject));
        if (groupNum === 1) filteredGroup1 = filteredData;
        if (groupNum === 2) filteredGroup2 = filteredData;
        if (groupNum === 3) filteredGroup3 = filteredData;
        renderGroupTable(groupNum, filteredData);
    }

    // --- HÀM XUẤT EXCEL ---

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Data");
        XLSX.writeFile(workbook, `${fileName}.xlsx`);
    }

    function updateProjectOptions() {
        const selectedGroup = aiGroupSelect.value;
        let projects = [];
        if (selectedGroup === '1') projects = group1Data.map(p => p['Dự án']);
        else if (selectedGroup === '2') projects = group2Data.map(p => p['Dự án']);
        else if (selectedGroup === '3') projects = group3Data.map(p => p['Dự án']);

        const uniqueProjects = [...new Set(projects)];
        aiProjectSelect.innerHTML = uniqueProjects.map(p => `<option value="${p}">${p}</option>`).join('');
    }

    async function callGeminiApi(prompt) {
        const apiKey = ""; // API key will be injected by the environment
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
        const payload = { contents: [{ parts: [{ text: prompt }] }] };

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                throw new Error(`API call failed with status: ${response.status}`);
            }
            const result = await response.json();
            const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
            return text || "Không nhận được phản hồi hợp lệ từ AI.";
        } catch (error) {
            console.error("Gemini API Error:", error);
            return `Đã xảy ra lỗi khi gọi AI. Vui lòng thử lại. Lỗi: ${error.message}`;
        }
    }

    function showModal(isLoading = true) {
        modal.style.display = 'flex';
        modalLoader.style.display = isLoading ? 'block' : 'none';
        if (isLoading) {
            modalContent.innerHTML = ''; // Clear previous content
            modalContent.appendChild(modalLoader);
        }
    }

    function hideModal() {
        modal.style.display = 'none';
    }

    generateBtn.addEventListener('click', async () => {
        showModal(true);

        const selectedGroup = aiGroupSelect.value;
        const selectedProject = aiProjectSelect.value;
        const groupData = allData.filter(p => p.Group == selectedGroup && p['Dự án'] === selectedProject);
        const memberNames = groupData.map(p => p['Họ tên']).join(', ');

        const prompt = `Bạn là một quản lý dự án chuyên nghiệp. Cho một dự án tên là '${selectedProject}', đội ngũ từ 'Group ${selectedGroup}' bao gồm các thành viên: ${memberNames}.

Dựa trên thông tin này, hãy tạo một bản tóm tắt dự án ngắn gọn bằng tiếng Việt, bao gồm các phần sau:

1. **Tổng quan dự án:** Một mô tả ngắn gọn, một câu về dự án dựa trên tên của nó.
2. **Thành phần đội ngũ:** Liệt kê các thành viên.
3. **Vai trò đề xuất:** Dựa trên tên dự án và một đội ngũ công nghệ tiêu chuẩn, đề xuất các vai trò tiềm năng cho các thành viên (ví dụ: Trưởng dự án, Lập trình viên chính, Lập trình viên, QA).
4. **Email khởi động dự án (bản nháp):** Soạn một email nháp gửi cho đội ngũ để khởi động dự án. Email phải chuyên nghiệp, thân thiện và tạo không khí tích cực. Sử dụng placeholder như [Tên người quản lý] cho tên người gửi.

Hãy định dạng câu trả lời rõ ràng với các tiêu đề được in đậm.`;

        const result = await callGeminiApi(prompt);

        modalLoader.style.display = 'none';
        modalContent.innerHTML = result.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<h3>$1</h3>');
    });

    closeModalBtn.addEventListener('click', hideModal);
    copyModalBtn.addEventListener('click', () => {
        const content = modalContent.innerText;

        textarea.value = content;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);

    // --- KHỞI TẠO ---

        document.getElementById('search-3').addEventListener('input', () => applyGroupFilters(3, group3Data));
        document.getElementById('project-filter-3').addEventListener('change', () => applyGroupFilters(3, group3Data));

        // Gắn sự kiện cho các nút tải xuống
        setupDownloadListeners();
    }

    XLSX.utils.book_new_from_json_sheet = function(json, sheetName) {
        var ws = XLSX.utils.json_to_sheet(json);
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
        return wb;
    };

    document.addEventListener('DOMContentLoaded', initialize);
