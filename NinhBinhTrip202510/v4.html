                <div class="budget-toolbar-section">
                    <!-- Optional toggle -->
                    <label class="budget-toggle-label" data-tippy-content="Hiển thị/ẩn các khoản chi tùy chọn (các khoản chi có thể bỏ qua)" data-tippy-maxWidth=250>
                        <input type="checkbox"
                               class="budget-toggle-checkbox"
                               id="budget-optional-toggle"
                               ${budgetState.showOptional ? 'checked' : ''}>
                        <span>Chi phí tùy chọn</span>
                    </label>

                    <!-- Grouping toggle (universal for all views) -->
                    <label class="budget-toggle-label" data-tippy-content="Hiển thị tổng phụ theo nhóm (ngày/danh mục/người)">
                        <input type="checkbox"
                               class="budget-toggle-checkbox"
                               id="budget-grouping-toggle"
                               ${budgetState.showGrouping ? 'checked' : ''}>
                        <span>Gộp theo nhóm</span>
                    </label>
                </div>

                <!-- Export CSV button -->
                <div class="budget-toolbar-section">
                    <button class="budget-btn budget-btn-secondary" id="budget-export-csv">
                        📥 Tải CSV
                    </button>
                </div>
            </div>
        `;
    }

    /**
     * Render a regular budget row
     * @param {Object} row - Budget item
     * @param {number} rowNumber - Row number for display
     * @returns {string} HTML string
     */
    function renderBudgetRow(row, rowNumber) {
        const categoryInfo = getCategoryDisplay(row.category);
        const categoryDisplay = `${categoryInfo.name} ${categoryInfo.icon}`;
        const amountDisplay = row.amount ? formatCurrency(row.amount, false) : '';
        const paidByDisplay = row.paidBy || '<span style="color: #9ca3af;">N/A</span>';
        const optionalDisplay = row.isOptional ? 'Tùy chọn' : '';

        // Check if current activity (#9)
        const isCurrentActivity = budgetState.currentActivityTitle &&
            row.activityTitle === budgetState.currentActivityTitle;
        const currentClass = isCurrentActivity ? ' current-activity' : '';

        return `
            <tr${currentClass}>
                <td>${rowNumber}</td>
                <td>${row.date || ''}</td>
                <td>${row.activityTitle || ''}</td>
                <td>${categoryDisplay}</td>
                <td>${row.name || ''}</td>
                <td class="text-right">${amountDisplay}</td>
                <td class="text-center">${optionalDisplay}</td>
                <td>${row.note || ''}</td>
                <td class="text-center">${paidByDisplay}</td>
            </tr>
        `;
    }

    /**
     * Render a date group header (for date grouping)
     * @param {Object} row - Date header info
     * @returns {string} HTML string
     */
    function renderDateHeader(row) {
        return `
            <tr class="date-group-header">
                <td colspan="9">
                    📅 Ngày ${row.date}: ${row.count} khoản - Tổng: ${formatCurrency(row.total, false)}đ
                </td>
            </tr>
        `;
    }

    /**
     * Render a category group header
     * @param {Object} row - Category header info
     * @returns {string} HTML string
     */
    function renderCategoryHeader(row) {
        return `
            <tr class="category-group-header">
                <td colspan="9">
                    ${row.categoryInfo.icon} ${row.categoryInfo.name.toUpperCase()}
                    (${row.count} khoản - Tổng: ${formatCurrency(row.total, false)}đ)
                </td>
            </tr>
        `;
    }

    /**
     * Render a person group header
     * @param {Object} row - Person header info
     * @returns {string} HTML string
     */
    function renderPersonHeader(row) {
        return `
            <tr class="person-split-row">
                <td colspan="9">
                    👤 ${row.person} đã chi: ${row.count} khoản -
                    Tổng: ${formatCurrency(row.total, false)}đ
                </td>
            </tr>
        `;
    }

    /**
     * Render bảng chi phí thành HTML
     * @param {Array} rows - Mảng budget items từ extractBudgetList()
     * @param {Object} totals - Tổng chi phí {total, optional} từ calculateBudgets()
     * @returns {string} HTML string của bảng
     */
    function renderBudgetTable(rows, totals, personTotals = null) {
        // Helper to generate sortable header
        const getSortClass = (column) => {
            if (budgetState.sortColumn === column) {
                return ` sortable sort-${budgetState.sortDirection}`;
            }
            return ' sortable';
        };

        // Empty state
        if (rows.length === 0) {
            return `
                <div class="budget-table-wrapper">
                    <div class="budget-empty-state">
                        <div class="budget-empty-state-icon">😕</div>
                        <div class="budget-empty-state-text">Không tìm thấy khoản chi nào</div>
                    </div>
                </div>
            `;
        }

        let html = `
            <div class="budget-table-wrapper">
                <table class="budget-table">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th class="${getSortClass('date')}" data-column="date">Ngày</th>
                            <th>Cụm hoạt động</th>
                            <th class="${getSortClass('category')}" data-column="category">Danh mục</th>
                            <th class="${getSortClass('name')}" data-column="name">Khoản chi</th>
                            <th class="text-right${getSortClass('amount')}" data-column="amount">Số tiền</th>
                            <th class="text-center${getSortClass('isOptional')}" data-column="isOptional">Tùy chọn</th>
                            <th>Ghi chú</th>
                            <th class="text-center${getSortClass('paidBy')}" data-column="paidBy">Người chi</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        // Render rows (handle different row types)
        let rowNumber = 0;
        rows.forEach((row) => {
            // Check row type and render accordingly
            if (row.isDateHeader) {
                html += renderDateHeader(row);
            } else if (row.isCategoryHeader) {
                html += renderCategoryHeader(row);
            } else if (row.isPersonHeader) {
                html += renderPersonHeader(row);
            } else {
                // Regular budget row
                rowNumber++;
                html += renderBudgetRow(row, rowNumber);
            }
        });

        // 1 dòng tổng (minimal & clean) + Person split nếu có
        const grandTotal = totals.total + totals.optional;
        html += `
                    </tbody>
                    <tfoot>
                        <tr class="grand-total-row">
                            <td colspan="8" class="text-right" style="padding-right: 1rem;">
                                <span style="color: #374151; font-weight: 500;">💰 Tổng: </span>
                                <span style="font-weight: 700; color: #111827;">${formatCurrency(totals.total, false)}</span>
                                <span style="color: #6b7280; font-weight: 400; font-size: 0.9375rem;"> (cơ bản)</span>
                                <span style="color: #6b7280; font-weight: 500;"> + </span>
                                <span style="font-weight: 700; color: #111827;">${formatCurrency(totals.optional, false)}</span>
                                <span style="color: #6b7280; font-weight: 400; font-size: 0.9375rem;"> (tùy chọn)</span>
                                <span style="color: #3b82f6; font-weight: 700; font-size: 1.125rem; margin: 0 0.5rem;"> = </span>
                            </td>
                            <td class="text-right" style="font-weight: 700; font-size: 1.25rem; color: #1e40af;">
                                ${formatCurrency(grandTotal, false)}đ
                            </td>
                        </tr>
        `;

        // Add person split info if in person view (#7)
        if (personTotals && Object.keys(personTotals).length === 2) {
            const split = calculateSplitBalance(personTotals);
            if (split) {
                html += `
                        <tr class="person-split-row">
                            <td colspan="9" style="text-align: center;">
                                ⚖️ <strong>${split.from}</strong> nên chuyển cho <strong>${split.to}</strong>:
                                <strong style="color: #ef4444;">${formatCurrency(split.amount, false)}đ</strong>
                            </td>
                        </tr>
                `;
            }
        }

        html += `
                    </tfoot>
                </table>
            </div>
        `;

        return html;
    }

    /**
     * Process and render budget content based on current state
     * @returns {Object} { html: string, personTotals: object }
     */
    function renderBudgetContent() {
        // Extract all rows once (cached in state)
        if (budgetState.allRows.length === 0) {
            budgetState.allRows = extractBudgetList(scheduleData);
        }

        let rows = budgetState.allRows;
        let personTotals = null;

        // Apply filters (#3, #6, #8)
        rows = filterBudgetRows(rows);

        // Calculate personTotals for "person" view (always, regardless of grouping)
        // This ensures split balance is always displayed in person view
        // Use allRows (not filtered) to calculate split balance for ALL items (including optional)
        // Only calculate for items with known paidBy (skip null/undefined)
        if (budgetState.view === 'person') {
            const personGroups = {};
            budgetState.allRows.forEach(row => {
                // Skip items without paidBy - only process items with known person
                if (row.paidBy) {
                    if (!personGroups[row.paidBy]) personGroups[row.paidBy] = 0;
                    personGroups[row.paidBy] += row.amount || 0;
                }
            });
            personTotals = personGroups;
        }

        // Apply view-specific grouping (if enabled)
        if (budgetState.showGrouping) {
            if (budgetState.view === 'timeline') {
                // Add date headers at the beginning of each date group (#1)
                rows = addDateHeaders(rows);
            } else if (budgetState.view === 'category') {
                // Group by category (#2)
                rows = groupByCategory(rows);
            } else if (budgetState.view === 'person') {
                // Group by person (#7)
                const grouped = groupByPerson(rows);
                rows = grouped.grouped;
                // personTotals already calculated above
            }
        }

        // Apply sorting (#4) - for all views
        if (budgetState.sortColumn) {
            if (budgetState.showGrouping) {
                // Sort within groups (preserves grouping structure)
                rows = sortWithinGroups(rows, budgetState.view);
            } else {
                // Sort all rows (flat list)
                rows = sortBudgetRows(rows);
            }
        }

        // Calculate totals (recalculate based on filtered rows)
        const regularRows = rows.filter(r => !r.isDateHeader && !r.isCategoryHeader && !r.isPersonHeader);
        const totals = {
            total: regularRows.filter(r => !r.isOptional).reduce((sum, r) => sum + (r.amount || 0), 0),
            optional: regularRows.filter(r => r.isOptional).reduce((sum, r) => sum + (r.amount || 0), 0),
        };

        // Render toolbar + table
        const toolbarHTML = renderBudgetToolbar();
        const tableHTML = renderBudgetTable(rows, totals, personTotals);

        return {
            html: toolbarHTML + tableHTML,
            personTotals: personTotals,
        };
    }

    /**
     * Refresh budget modal content (re-render based on state)
     * Save and restore focus to prevent input blur
     */
    function refreshBudgetModal() {
        if (!budgetModalElement) return;

        // Save focus state before re-rendering
        const activeElement = document.activeElement;
        const isSearchInput = activeElement && activeElement.id === 'budget-search-input';
        const cursorPosition = isSearchInput ? activeElement.selectionStart : null;

        const content = renderBudgetContent();
        const modalBody = budgetModalElement.querySelector('.modal-body');
        if (modalBody) {
            modalBody.innerHTML = content.html;
            // Re-attach event listeners
            attachBudgetEventListeners();

            // Reinitialize tooltips for new elements
            initTippyTooltips();

            // Restore focus to search input if it was focused
            if (isSearchInput) {
                const searchInput = document.getElementById('budget-search-input');
                if (searchInput) {
                    searchInput.focus();
                    // Restore cursor position
                    if (cursorPosition !== null) {
                        searchInput.setSelectionRange(cursorPosition, cursorPosition);
                    }
                }
            }
        }
    }

    /**
     * Export budget data to CSV (#5)
     */
    function exportBudgetToCSV() {
        const rows = filterBudgetRows(budgetState.allRows);

        // CSV header
        let csv = 'STT,Ngày,Cụm hoạt động,Danh mục,Khoản chi,Số tiền,Tùy chọn,Ghi chú,Người chi\n';

        // CSV rows
        rows.forEach((row, index) => {
            const rowNumber = index + 1;
            const categoryInfo = getCategoryDisplay(row.category);
            const categoryDisplay = `${categoryInfo.name} ${categoryInfo.icon}`;
            const amount = row.amount || 0;
            const optional = row.isOptional ? 'Tùy chọn' : '';
            const note = (row.note || '').replace(/"/g, '""'); // Escape quotes
            const activityTitle = (row.activityTitle || '').replace(/"/g, '""');
            const name = (row.name || '').replace(/"/g, '""');

            csv += `${rowNumber},"${row.date || ''}","${activityTitle}","${categoryDisplay}","${name}",${amount},"${optional}","${note}","${row.paidBy || ''}"\n`;
        });

        // Create download
        const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', `budget_${new Date().getTime()}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    /**
     * Attach event listeners to budget modal controls
     */
    function attachBudgetEventListeners() {
        // View switcher tabs
        const viewTabs = document.querySelectorAll('.budget-view-tab');
        viewTabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                const view = e.target.dataset.view;
                if (view && view !== budgetState.view) {
                    budgetState.view = view;
                    budgetState.sortColumn = null; // Reset sort when changing view
                    budgetState.sortDirection = null;
                    refreshBudgetModal();
                }
            });
        });

        // Search input (#6) with debounce
        const searchInput = document.getElementById('budget-search-input');
        if (searchInput) {
            let searchTimeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    budgetState.searchQuery = e.target.value;
                    refreshBudgetModal();
                }, 300); // 300ms debounce
            });
        }

        // Category filter (#3)
        const categoryFilter = document.getElementById('budget-category-filter');
        if (categoryFilter) {
            categoryFilter.addEventListener('change', (e) => {
                budgetState.categoryFilter = e.target.value;
                refreshBudgetModal();
            });
        }

        // Optional toggle (#8)
        const optionalToggle = document.getElementById('budget-optional-toggle');
        if (optionalToggle) {
            optionalToggle.addEventListener('change', (e) => {
                budgetState.showOptional = e.target.checked;
                refreshBudgetModal();
            });
        }

        // Grouping toggle (universal for all views)
        const groupingToggle = document.getElementById('budget-grouping-toggle');
        if (groupingToggle) {
            groupingToggle.addEventListener('change', (e) => {
                budgetState.showGrouping = e.target.checked;
                refreshBudgetModal();
            });
        }

        // Export CSV (#5)
        const exportBtn = document.getElementById('budget-export-csv');
        if (exportBtn) {
            exportBtn.addEventListener('click', () => {
                exportBudgetToCSV();
            });
        }

        // Sortable headers (#4)
        const sortableHeaders = document.querySelectorAll('.budget-table th.sortable');
        sortableHeaders.forEach(th => {
            th.addEventListener('click', (e) => {
                const column = e.target.dataset.column;
                if (!column) return;

                // Toggle sort direction
                if (budgetState.sortColumn === column) {
                    if (budgetState.sortDirection === 'asc') {
                        budgetState.sortDirection = 'desc';
                    } else {
                        // Reset sort
                        budgetState.sortColumn = null;
                        budgetState.sortDirection = null;
                    }
                } else {
                    budgetState.sortColumn = column;
                    budgetState.sortDirection = 'asc';
                }

                refreshBudgetModal();
            });
        });
    }

    /**
     * Khởi tạo budget modal (chỉ gọi 1 lần)
     */
    function initBudgetModal() {
        // Generate initial content
        const content = renderBudgetContent();

        // Use high-level createModal API
        budgetModalElement = createModal({
            id: 'budget-modal',
            title: '💰 Bảng Kê Chi Phí Chi Tiết',
            content: content.html
        });

        // Attach event listeners
        attachBudgetEventListeners();

        // Initialize tooltips for modal elements
        initTippyTooltips();
    }

    /**
     * Detect current activity for highlighting (#9)
     * @returns {string|null} Current activity title
     */
    function detectCurrentActivity() {
        const currentActivityElement = document.querySelector('.activity-item.current-activity');
        if (currentActivityElement) {
            const titleElement = currentActivityElement.querySelector('.activity-title');
            if (titleElement) {
                return titleElement.textContent.trim();
            }
        }
        return null;
    }

    /**
     * Detect if device supports touch events
     * @returns {boolean} True if touch device (mobile/tablet)
     */
    function isTouchDevice() {
        return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    }

    /**
     * Mở budget modal
     */
    function openBudgetModal() {
        // Detect current activity for highlighting (#9)
        budgetState.currentActivityTitle = detectCurrentActivity();

        // Check tường minh: chỉ init nếu chưa có
        if (budgetModalElement === null) {
            initBudgetModal();
        } else {
            // Refresh to update highlight
            refreshBudgetModal();
        }

        openModal(budgetModalElement);
    }

    // --- KHỞI CHẠY ---
    document.addEventListener('DOMContentLoaded', () => {
        // Render lịch trình lần đầu
        renderTimeline(scheduleData);

        // Setup Tippy.js tooltips for static elements (timeline, header, etc.)
        initTippyTooltips();

        // Sự kiện cho nút Ẩn/Hiện Test Panel
        const toggleTestPanelButton = document.getElementById('toggle-test-panel');
        const testPanelContent = document.getElementById('test-panel-content');

        toggleTestPanelButton.addEventListener('click', () => {
            const isExpanded = testPanelContent.classList.toggle('expanded');
            toggleTestPanelButton.classList.toggle('expanded'); // Để xoay icon (nếu có)
            if (isExpanded) {
                testPanelContent.style.maxHeight = testPanelContent.scrollHeight + 'px';
            } else {
                testPanelContent.style.maxHeight = '0px';
            }
        });

        // Hàm xử lý khi thời gian giả lập thay đổi
        function handleSimulatedTimeChange() {
            updateTimeline();
            updateUrlParams(); // Cập nhật URL
        }

        // Sự kiện cho nút reset
        resetTimeButton.addEventListener('click', () => {
            timeOverrideDateInput.value = '';
            timeOverrideTimeInput.value = '';
            handleSimulatedTimeChange();
        });

        // Sự kiện khi thay đổi input
        timeOverrideDateInput.addEventListener('change', handleSimulatedTimeChange);
        timeOverrideTimeInput.addEventListener('change', handleSimulatedTimeChange);

        // --- XỬ LÝ PARAM TỪ URL (Lấy từ v2.html) ---
        // Giúp bạn chia sẻ link với thời gian giả lập
        // ví dụ: ...NinhBinh_v3.html?time=2025-11-15T09:30:00
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const timeParam = urlParams.get('time');

            if (timeParam) {
                const simulatedDate = new Date(timeParam);

                if (!isNaN(simulatedDate.getTime())) {
                    const dateValue = `${simulatedDate.getFullYear()}-${pad(simulatedDate.getMonth() + 1)}-${pad(simulatedDate.getDate())}`;
                    timeOverrideDateInput.value = dateValue;

                    const hasTime = /T|:| /.test(timeParam);
                    if (hasTime) {
                        const timeValue = `${pad(simulatedDate.getHours())}:${pad(simulatedDate.getMinutes())}:${pad(simulatedDate.getSeconds())}`;
                        timeOverrideTimeInput.value = timeValue;
                    }

                    // Tự động mở panel
                    if (!testPanelContent.classList.contains('expanded')) {
                        testPanelContent.classList.add('expanded');
                        toggleTestPanelButton.classList.add('expanded');
                        testPanelContent.style.maxHeight = testPanelContent.scrollHeight + 'px';
                    }
                } else {
                    console.warn("Giá trị 'time' trên URL không hợp lệ:", timeParam);
                }
            }
        } catch (e) {
            console.error("Lỗi khi xử lý URL param 'time':", e);
        }
        // --- KẾT THÚC XỬ LÝ PARAM ---

        // --- AUTO-OPEN MODAL FROM URL PARAMS ---
        // Check if modal param exists (?modal=budget&modal-fullscreen=true)
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const modalParam = urlParams.get('modal');
            const modalFullscreenParam = urlParams.get('modal-fullscreen');

            if (modalParam === 'budget') {
                // Open budget modal
                openBudgetModal();

                // If modal-fullscreen=true, enter fullscreen mode
                if (modalFullscreenParam === 'true' && budgetModalElement) {
                    // Wait for modal to open then apply fullscreen
                    setTimeout(() => {
                        toggleModalFullscreen(budgetModalElement, true);
                    }, 100); // Small delay to ensure modal is rendered
                }
            }
        } catch (e) {
            console.error("Lỗi khi xử lý URL param 'modal':", e);
        }
        // --- KẾT THÚC AUTO-OPEN MODAL ---

        // --- SETUP EVENT LISTENER CHO BUDGET MODAL ---
        // Tìm element bằng ID (unique, safe)
        const budgetDisplayElement = document.getElementById('header-budget-display');
        if (budgetDisplayElement) {
            budgetDisplayElement.addEventListener('click', (e) => {
                e.preventDefault(); // Ngăn default behavior nếu là link
                openBudgetModal();
            });
        } else {
            console.warn('Budget display element not found. Budget modal will not be available.');
        }

        // Bắt đầu vòng lặp cập nhật thời gian thực
        setInterval(updateTimeline, 1000); // 1 giây một lần

        // Chạy lần đầu tiên khi tải trang
        updateTimeline();
    });
</script>
