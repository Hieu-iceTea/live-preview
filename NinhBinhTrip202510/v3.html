<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!--
      Tiêu đề tôi lấy từ file index.html của bạn
    -->
    <title>Your Trip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="route.png" type="image/x-icon">
    <style>
        /* Sử dụng font Inter mượt mà hơn */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        html {
            scroll-behavior: smooth; /* Cuộn mượt */
        }

        body {
            font-family: 'Inter', sans-serif;
            /* Lấy màu nền từ index.html */
            background-color: #f4f7f6;
        }

        /* (MỚI) Thay thế border-bottom của header bằng shadow xanh nhẹ nhàng */
        #header {
            /* 0 5px 15px -3px là bóng tương đương shadow-lg của tailwind */
            /* rgba(37, 99, 235, 0.1) là màu xanh (blue-600) với 10% độ mờ */
            box-shadow: 0 5px 15px -3px rgba(37, 99, 235, 0.1);
        }

        /* CSS CHO TIMELINE (Style của index.html)
        */
        .timeline-item {
            position: relative;
            /* Padding giống index.html */
            padding-left: 2.5rem; /* 40px */
            padding-bottom: 2.5rem; /* 40px */
            transition: all 0.3s ease;
        }

        .timeline-item:last-child {
            padding-bottom: 0;
        }

        /* Đường kẻ dọc (Logic của v2) */
        .timeline-line {
            position: absolute;
            /* Căn giữa icon 24px (left: 11px) */
            left: 11px;
            /* Điều chỉnh top cho khớp icon */
            top: 1.25rem;
            bottom: -0.5rem; /* -8px */
            width: 2px;
            background-color: #cbd5e1; /* gray-300 */
        }

        .timeline-item:last-child .timeline-line {
            display: none; /* Ẩn đường kẻ ở mục cuối */
        }

        /* Icon container (Style của index.html) */
        .icon-container {
            position: absolute;
            left: 0;
            top: 0.5rem; /* 8px */
            /* Kích thước 24x24px giống index.html */
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px; /* rounded-full */
            z-index: 10;
            transition: all 0.3s ease;
        }

        /* CSS TRẠNG THÁI (Logic của v2, Style của index.html)
        */

        /* Lớp cho trạng thái "Đã qua" */
        .status-past {
            opacity: 0.7; /* Giảm độ mờ giống index.html */
        }

        .status-past .timeline-card {
            background-color: #f8fafc; /* slate-50 */
        }

        .status-past .timeline-line {
            background-color: #16a34a; /* green-600 */
        }

        .status-past .icon-container {
            /* Dùng background-color thay vì border */
            background-color: #16A34ADB; /* gray-400 */
        }

        /* Lớp cho trạng thái "Đang diễn ra" */
        .status-current .timeline-card {
            /* Style phóng to + border xanh giống cả 2 file */
            transform: scale(1.02);
            border: 2px solid #2563eb; /* blue-600 */
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        .status-current .icon-container {
            /* Dùng background-color */
            background-color: #2563eb; /* blue-600 */
            /* Giữ lại animation nhấp nháy xịn của v2 */
            animation: pulse-blue 1.5s infinite;
        }

        .status-current .timeline-line {
            /* Giữ lại logic đổi màu 2 nửa của v2 */
            background: linear-gradient(#16a34a, #16a34a 50%, #2563eb 50%, #2563eb);
            background-size: 100% 10px;
        }

        /* Lớp cho trạng thái "Sắp tới" */
        .status-future .icon-container {
            /* Dùng background-color */
            background-color: #cbd5e1; /* slate-300 */
        }

        /* Ẩn chi tiết (Logic của v2) */
        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: all 0.35s ease-out; /* Nhanh hơn 0.5s của index.html */
            margin-top: 0; /* mt-3 */
            padding-top: 0; /* pt-3 */
            border-top: 0 solid transparent;
        }

        /* (MỚI) Thêm style cho .details-content khi được mở rộng */
        /* Các class mt-3, pt-3, border-t sẽ được áp dụng tại đây thay vì trong HTML */
        .details-content.expanded {
            margin-top: 0.75rem; /* mt-3 */
            padding-top: 0.75rem; /* pt-3 */
            border-top: 1px solid #e2e8f0; /* border-t border-gray-200 */
        }

        /* (MỚI) Ghi đè style cho panel giả lập */
        #test-panel-content.expanded {
            border-top: none; /* Bỏ đường gạch ngang màu xám */
            padding-top: 0; /* Bỏ padding-top của .details-content */
        }

        /* Nút xem chi tiết (Style của index.html) */
        .toggle-details svg {
            transition: transform 0.3s ease;
        }

        /* JS sẽ thêm/xóa class 'expanded' trên nút này */
        .toggle-details.expanded svg {
            transform: rotate(180deg);
        }

        /* Animation nhấp nháy (Lấy từ v2) */
        @keyframes pulse-blue {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(37, 99, 235, 0);
            }
        }

        /* (MỚI) Thêm animation cho thời gian còn lại khẩn cấp */
        @keyframes pulse-red {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        .pulse-urgent {
            animation: pulse-red 1s infinite;
            /* (ĐÃ SỬA) Xóa font-weight: 700; ra khỏi đây */
            /* JS sẽ thêm class 'time-warning-30min' riêng */
        }

        .time-warning-30min {
            font-weight: 700 !important; /* bold */
            font-size: 15px !important;
        }

        /* Optimize animation cho time-remaining */
        .time-remaining {
            will-change: transform; /* GPU acceleration cho animation mượt mà */
        }

        /* Chi tiết bên trong phần mở rộng (Lấy từ index.html) */
        .details-content h4 {
            font-weight: 600;
            font-size: 0.875rem;
            color: #4b5563;
            margin-bottom: 4px;
            margin-top: 8px;
        }

        .details-content p {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .details-content ul {
            list-style-type: disc;
            padding-left: 20px;
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 8px;
        }

        /* Icon Google Maps inline cho địa điểm */
        .place-map-icon {
            display: inline-flex;
            align-items: center;
            margin-left: 2px;
            color: #3b82f6; /* blue-500 */
            text-decoration: none;
            transition: color 0.2s ease, transform 0.2s ease;
            vertical-align: middle;
        }

        .place-map-icon:hover {
            color: #2563eb; /* blue-600 */
            transform: scale(1.15);
        }

        .place-map-icon svg {
            display: block;
            width: 16px; /* To icon lên để dễ nhìn hơn */
            height: 16px;
            margin-top: -4px; /* Nâng icon lên 1px để căn giữa với text */
        }

        /* Icon Google Maps cho day header (tổng quan cả ngày) */
        .day-map-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px; /* Khoảng cách giữa icon và text */
            padding: 4px; /* Tăng hit area để dễ click */
            color: #3b82f6; /* blue-500 */
            font-size: 0.875rem; /* 14px - nhỏ hơn tiêu đề */
            transition: color 0.2s ease, transform 0.2s ease;
            text-decoration: none; /* Bỏ gạch chân mặc định */
        }

        .day-map-link:hover {
            color: #2563eb; /* blue-600 */
            transform: scale(1.05); /* Giảm scale để phù hợp với text */
            text-decoration: underline; /* Gạch chân khi hover */
        }

        .day-map-link svg {
            display: block;
            flex-shrink: 0; /* Không cho icon bị co lại */
        }

        .day-map-link span {
            font-weight: 500; /* Medium weight cho text */
            white-space: nowrap; /* Không cho text xuống dòng */
        }
    </style>
</head>
<body class="bg-gray-100">

<!--
  HEADER CỐ ĐỊNH
  Layout kết hợp:
  - Lấy style tiêu đề, layout đồng hồ, box "Hoạt động hiện tại" của index.html
  - Giữ lại "Công cụ Giả lập thời gian" của v2.html
-->
<!-- (ĐÃ SỬA) Xóa class 'shadow-lg', 'border-b-4', 'border-blue-600' -->
<!-- CSS trong <style> (ở trên) sẽ thêm shadow màu xanh nhạt. -->
<header id="header" class="sticky top-0 left-0 w-full bg-white z-50 p-4">
    <!--
      Sử dụng max-w-4xl giống index.html
    -->
    <div class="container mx-auto max-w-4xl">
        <!-- Tiêu đề chính (Style index.html) -->
        <div class="flex flex-col sm:flex-row justify-between items-center mb-3">
            <div class="text-center sm:text-left">
                <!--
                  ID 'main-title' và 'main-subtitle' được giữ lại từ v2.html
                  để JS tự động điền dữ liệu
                -->
                <h1 id="main-title" class="text-3xl font-bold text-blue-600"></h1>
                <p id="main-subtitle" class="text-lg text-gray-600"></p>
            </div>

            <!-- Đồng hồ thời gian thực (Lấy ID 'real-time-clock' từ v2.html) -->
            <div id="real-time-clock" class="text-center sm:text-right mt-2 sm:mt-0">
                <div class="font-mono font-bold text-2xl text-gray-900">...</div>
                <div class="text-sm text-gray-500">...</div>
            </div>
        </div>

        <!-- Hoạt động hiện tại (Lấy layout từ index.html, ID từ v2.html) -->
        <div id="current-activity-container"
             class="hidden bg-blue-100 border border-blue-200 p-3 rounded-md text-center mb-3">
            <p class="text-xs text-blue-700 font-medium">Lịch trình hiện tại của bạn:</p>
            <p id="current-activity-display" class="text-lg font-semibold text-blue-800"></p>
        </div>

        <!-- Bộ điều khiển giả lập thời gian (Giữ nguyên của v2.html) -->
        <div class="mt-2 p-2 bg-yellow-50 border border-yellow-300 rounded-lg">
            <button id="toggle-test-panel" class="font-medium text-sm text-yellow-800 hover:underline w-full text-left">
                Công cụ Giả lập thời gian (Nhấn để Ẩn/Hiện)
            </button>
            <!--
              Tôi đã sửa lại CSS cho .details-content
              Nên ở đây tôi thêm class 'details-content' để tái sử dụng
            -->
            <div id="test-panel-content" class="details-content">
                <!-- (ĐÃ SỬA) Bỏ 'mt-4' để UI gọn gàng hơn,
                     chỉ giữ lại 'border-t' (vàng) và 'pt-4' (padding)
                -->
                <div class="border-t border-yellow-200 pt-4 flex flex-wrap gap-4 items-end">
                    <div class="flex-1 min-w-[140px]">
                        <label for="time-override-date" class="block text-xs font-medium text-yellow-800 mb-1">Giả lập
                            ngày:</label>
                        <input type="date" id="time-override-date" class="w-full p-1 border rounded text-sm h-[34px]">
                    </div>

                    <div class="flex-1 min-w-[140px]">
                        <label for="time-override-time" class="block text-xs font-medium text-yellow-800 mb-1">Giả lập
                            giờ (có giây):</label>
                        <input type="time" id="time-override-time" class="w-full p-1 border rounded text-sm h-[34px]"
                               step="1">
                    </div>

                    <button id="reset-time"
                            class="px-3 py-1 bg-yellow-600 text-white rounded text-sm hover:bg-yellow-700 h-[34px] flex-shrink-0">
                        Hiện tại
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>

<!--
  NỘI DUNG LỊCH TRÌNH
  Sử dụng max-w-4xl giống index.html
-->
<main class="container mx-auto max-w-4xl p-4 md:p-8 relative">
    <!-- Nơi JS sẽ chèn nội dung timeline (Logic của v2) -->
    <div id="timeline-container"></div>
</main>

<script>
    // ========================================================================
    // === DỮ LIỆU LỊCH TRÌNH (scheduleData) ===
    // ========================================================================
    //
    // Đây là biến chứa TOÀN BỘ dữ liệu cho chuyến đi của bạn.
    // Dữ liệu này được tách biệt hoàn toàn khỏi HTML và logic code,
    // giúp bạn dễ dàng chỉnh sửa lịch trình hoặc TẠO CHUYẾN ĐI MỚI
    // chỉ bằng cách thay đổi nội dung JSON này.
    //
    // ------------------------------------------------------------------------
    // 📋 CẤU TRÚC DỮ LIỆU (Phiên bản rút gọn để xem tổng quan)
    // ------------------------------------------------------------------------
    // tripInfo: Thông tin chung
    // schedule: Mảng các ngày
    //   dayInfo: Thông tin ngày
    //   timelineItems: Mảng các hoạt động
    //     timeInfo: startTime (ISO), endTime (ISO)
    //     title, summary, iconType
    //     details: directions?, places?, budgets?, reason?
    //
    // ------------------------------------------------------------------------
    // 📋 CẤU TRÚC DỮ LIỆU
    // ------------------------------------------------------------------------
    //
    // {
    //   "tripInfo": {                          // === THÔNG TIN CHUYẾN ĐI ===
    //     "title": string,                     // Tiêu đề chuyến đi (hiển thị ở header và tab title)
    //     "subtitle": string,                  // Phụ đề (ai đi, bao nhiêu ngày)
    //     "dates": string,                     // Ngày tháng (dạng text tự do: "15-16/11/2025")
    //     "defaultRegion": string,             // Vùng/tỉnh mặc định (dùng để tự động tạo Google Maps URL)
    //     "totalBudget": number                // Tổng chi phí dự kiến (VNĐ, hiển thị ở subtitle)
    //   },
    //
    //   "schedule": [                          // === DANH SÁCH CÁC NGÀY ===
    //     {
    //       "dayInfo": {                       // --- Thông tin ngày ---
    //         "day": number,                   // Số thứ tự ngày (1, 2, 3, ...)
    //         "date": string,                  // Ngày (format: "YYYY-MM-DD", vd: "2025-11-15")
    //         "title": string,                 // Tiêu đề ngày (vd: "Ngày 1: Thứ 7, 15/11/2025")
    //         "mapUrl": string                 // (Optional) Link Google Maps tổng quan cả ngày
    //       },
    //
    //       "timelineItems": [                 // --- Danh sách hoạt động trong ngày ---
    //         {
    //           "timeInfo": {                  // • Thông tin thời gian
    //             "startTime": string,         //   - Thời gian bắt đầu (ISO 8601: "YYYY-MM-DDTHH:MM:SS")
    //             "endTime": string,           //   - Thời gian kết thúc (ISO 8601: "YYYY-MM-DDTHH:MM:SS")
    //             "durationText": string       //   - (Optional, TỰ ĐỘNG TÍNH) Thời lượng (vd: "1 giờ 45 phút")
    //           },
    //
    //           "title": string,               // • Tiêu đề hoạt động
    //           "summary": string,             // • Tóm tắt ngắn gọn
    //           "iconType": string,            // • Loại icon: time | logistics | boat | food | explore | hotel | nightlife | relax | default
    //
    //           "details": {                   // • Chi tiết (hiển thị khi mở rộng)
    //             "directions": {              //   ◦ Thông tin di chuyển (optional)
    //               "mapUrl": string,          //     - Link Google Maps Directions (nếu rỗng → tự động tạo từ places)
    //               "steps": string[]          //     - Các bước di chuyển (mảng chuỗi)
    //             },
    //
    //             "places": string | [        //   ◦ Địa điểm (có thể là string hoặc mảng object)
    //               {
    //                 "name": string,          //     - Tên địa điểm
    //                 "description": string,   //     - Mô tả
    //                 "mapUrl": string         //     - (Optional) Link Google Maps (nếu rỗng → tự động tạo)
    //               }
    //             ],
    //
    //             "budgets": [                 //   ◦ Chi phí (optional)
    //               {
    //                 "name": string,          //     - Tên khoản chi
    //                 "amount": number,        //     - Số tiền (VNĐ)
    //                 "category": string,      //     - (Optional) Loại: hotel | food | drink | transport | ticket | shopping | relax | other
    //                 "note": string           //     - (Optional) Ghi chú
    //               }
    //             ],
    //
    //             "reason": string             //   ◦ Lý do lựa chọn (optional)
    //           }
    //         }
    //       ]
    //     }
    //   ]
    // }
    //
    // ------------------------------------------------------------------------
    // 🔄 CÁCH SỬ DỤNG & TÁI SỬ DỤNG
    // ------------------------------------------------------------------------
    //
    // 1. TẠO CHUYẾN ĐI MỚI:
    //    - Copy toàn bộ biến scheduleData này sang file HTML mới
    //    - Thay đổi tripInfo (title, subtitle, dates, defaultRegion, totalBudget)
    //    - Thay đổi schedule (các ngày và hoạt động)
    //    - Save file → Mở trình duyệt → Hoàn thành!
    //
    // 2. CHỈNH SỬA LỊCH TRÌNH HIỆN TẠI:
    //    - Tìm đến phần schedule → tìm ngày cần sửa → tìm item cần sửa
    //    - Thay đổi các trường: title, summary, timeInfo, details, ...
    //    - Refresh trình duyệt để xem kết quả
    //
    // 3. LƯU Ý QUAN TRỌNG:
    //    ✓ Thời gian (startTime, endTime): Phải dùng định dạng ISO 8601
    //      Ví dụ: "2025-11-15T08:30:00" (năm-tháng-ngày T giờ:phút:giây)
    //
    //    ✓ durationText: KHÔNG CẦN điền thủ công, hệ thống sẽ tự động tính
    //      từ startTime và endTime. Ví dụ: 05:30 → 07:15 = "1 giờ 45 phút"
    //
    //    ✓ mapUrl: Có thể bỏ trống (empty string "") → hệ thống sẽ TỰ ĐỘNG tạo
    //      Google Maps URL dựa trên tên địa điểm + defaultRegion
    //
    //    ✓ iconType: Chọn 1 trong các giá trị sau:
    //      - time: đồng hồ (xuất phát, về, chuẩn bị)
    //      - logistics: túi đồ (gửi đồ, check-in/out)
    //      - boat: thuyền (đi thuyền, tour sông)
    //      - food: đồ ăn (ăn sáng, trưa, tối)
    //      - explore: bản đồ (tham quan, khám phá)
    //      - hotel: giường (nhà nghỉ, khách sạn)
    //      - nightlife: trăng sao (chơi đêm, phố đêm)
    //      - relax: cafe (nghỉ ngơi, thư giãn)
    //      - default: lịch (các hoạt động khác)
    //
    //    ✓ budgets.category: Chọn 1 trong các giá trị sau (để hiển thị emoji phù hợp):
    //      hotel 🏠 | food 🍜 | drink ☕ | transport 🚕 | ticket 🎫 | shopping 🛍️ | relax 💆 | other 💰
    //
    // 4. TÍ MẸO:
    //    - Dùng "Công cụ Giả lập thời gian" (ở header) để test lịch trình
    //    - Chia sẻ link với tham số ?time=2025-11-15T09:30:00 để xem tại thời điểm cụ thể
    //    - Nếu muốn ẩn 1 hoạt động tạm thời: Comment toàn bộ object {...} của item đó
    //
    // ========================================================================
    const scheduleData = {
        "tripInfo": {
            "title": "Ninh Bình trip 2025", // Đổi tiêu đề
            "subtitle": "Hiếu & Chi | 2 Ngày 1 Đêm",
            "dates": "15-16/11/2025",
            "defaultRegion": "Ninh Bình", // Vùng/tỉnh mặc định cho tìm kiếm bản đồ
            "totalBudget": 4015000 // Tính toán bằng tay và ghi tổng chi phí chuyến đi vào đây. (Tổng cho tất cả mọi người)
        },
        "schedule": [
            // NGÀY 1
            {
                "dayInfo": {
                    "day": 1,
                    "date": "2025-11-15",
                    "title": "Ngày 1: Thứ 7, 15/11 (Tam Cốc, Hoa Lư & Phố đêm)",
                    "mapUrl": "https://google.com/maps"
                },
                "timelineItems": [
                    {
                        "timeInfo": {
                            "startTime": "2025-11-15T05:30:00",
                            "endTime": "2025-11-15T07:15:00"
                        },
                        "title": "Xuất phát từ Hà Nội & Nghỉ chân/Ăn sáng",
                        "summary": "Lái xe máy, di chuyển đến Trung tâm TP. Ninh Bình. Quãng đường ~90km, đi theo QL1A cũ. Thời gian di chuyển khoảng 1h45p - 2h. Có dừng nghỉ ngơi & ăn sáng.",
                        "iconType": "time", // 'time' sẽ gọi icon đồng hồ

    function getIcon(iconType) {
        return icons[iconType] || icons.default;

    // --- HÀM FORMAT TIỀN TỆ ---
    /**
     * Format số tiền thành chuỗi VND
     * @param {number} amount - Số tiền
     * @returns {string} - Chuỗi đã format (vd: "120.000đ")
     */
    function formatCurrency(amount) {
        if (!amount || amount === 0) return '0đ';
        return amount.toLocaleString('vi-VN') + 'đ';
    }

    // --- HÀM RENDER CHI PHÍ (BUDGET) ---
    /**
     * Render section "Chi phí" (từ details.budgets)
     * @param {Array} budgets - Mảng budget items từ details.budgets
     * @returns {string} - HTML string hoặc empty string
     */
    function renderBudget(budgets) {
        // Kiểm tra budgets có tồn tại và là array không rỗng
        if (!budgets || !Array.isArray(budgets) || budgets.length === 0) {
            return '';
        }

        // Icon mapping cho categories
        const categoryIcons = {
            "hotel": "🏠",
            "food": "🍜",
            "drink": "☕",
            "transport": "🚕",
            "ticket": "🎫",
            "shopping": "🛍️",
            "relax": "💆",
            "other": "💰"
        };

        // Heading:
        let html = '<h4>Chi phí</h4>';
        html += '<ul class="budget-list">';

        budgets.forEach(item => {
            const icon = item.category ? categoryIcons[item.category] || "💰" : "💰";
            const amount = formatCurrency(item.amount || 0);

            // Format: 🎫 Vé tham quan: 120.000đ
            let itemText = `${icon} ${item.name}: ${amount}`;

            // Thêm note nếu có (trong ngoặc đơn)
            if (item.note) {
                itemText += ` (${item.note})`;
            }

            html += `<li>${itemText}</li>`;
        });

        html += '</ul>';

        return html;
    }

    // --- HÀM TÍNH TOÁN THỜI GIAN TỰ ĐỘNG ---
    /**
     * Tính toán và format thời gian khoảng cách giữa startTime và endTime
     * @param {string|Date} startTime - Thời gian bắt đầu (ISO string hoặc Date object)
     * @param {string|Date} endTime - Thời gian kết thúc (ISO string hoặc Date object)
     * @returns {string} - Chuỗi thời gian đã format (vd: "1 giờ 45 phút", "30 phút", "2 giờ")
     */
    function calculateDuration(startTime, endTime) {
        const start = new Date(startTime);
        const end = new Date(endTime);

        // Tính khoảng cách tính bằng milliseconds
        const durationMs = end.getTime() - start.getTime();

        // Chuyển đổi sang phút và giờ
        const totalMinutes = Math.floor(durationMs / (1000 * 60));
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;

        // Format chuỗi kết quả
        if (hours > 0 && minutes > 0) {
            return `${hours} giờ ${minutes} phút`;
        } else if (hours > 0) {
            return `${hours} giờ`;
        } else if (minutes > 0) {
            return `${minutes} phút`;
        } else {
            return ""; // Trường hợp đặc biệt: thời gian = 0
        }
    }

    // --- HÀM TỰ ĐỘNG TẠO GOOGLE MAPS DIRECTIONS URL ---
    /**
     * Tự động tạo Google Maps Directions URL từ danh sách địa điểm (2+ địa điểm)
     * @param {Array} places - Mảng các địa điểm (có thể là object hoặc string)
     * @param {string|null} region - Vùng/tỉnh (optional, tự động lấy từ scheduleData.tripInfo.defaultRegion nếu không truyền)
     * @returns {string|null} - Google Maps directions URL hoặc null nếu không hợp lệ
     */
    function generateDirectionsMapUrl(places, region = null) {
        if (!places || !Array.isArray(places) || places.length === 0) {
            return null;
        }

        // Lấy tên địa điểm (hỗ trợ cả object và string)
        const locationNames = places.map(place => {
            if (typeof place === 'object' && place.name) {
                return place.name;
            }
            return place;
        }).filter(Boolean);

        if (locationNames.length === 0) {
            return null;
        }

        // Tự động lấy region từ scheduleData.tripInfo.defaultRegion nếu không truyền vào
        if (!region && scheduleData && scheduleData.tripInfo && scheduleData.tripInfo.defaultRegion) {
            region = scheduleData.tripInfo.defaultRegion;
        }

        // Encode và tạo URL
        const encodedLocations = locationNames
            .map(name => encodeURIComponent(
                region
                    ? `${name.trim()}, ${region}`
                    : name.trim()
            ))
            .join('/');

        return `https://www.google.com/maps/dir/${encodedLocations}`;
    }

    // --- HÀM TỰ ĐỘNG TẠO GOOGLE MAPS SEARCH URL CHO 1 ĐỊA ĐIỂM ---
    /**
     * Tự động tạo Google Maps Search URL cho 1 địa điểm
     * @param {string} placeName - Tên địa điểm
     * @param {string|null} region - Vùng/tỉnh (optional, tự động lấy từ scheduleData.tripInfo.defaultRegion nếu không truyền)
     * @returns {string|null} - Google Maps search URL hoặc null nếu không hợp lệ
     */
    function generatePlaceSearchUrl(placeName, region = null) {
        if (!placeName || typeof placeName !== 'string') {
            return null;
        }

        // Tự động lấy region từ scheduleData.tripInfo.defaultRegion nếu không truyền vào
        if (!region && scheduleData && scheduleData.tripInfo && scheduleData.tripInfo.defaultRegion) {
            region = scheduleData.tripInfo.defaultRegion;
        }

        // Tạo search query (có hoặc không có region)
        const searchQuery = region
            ? `${placeName.trim()}, ${region}`
            : placeName.trim();

        const encoded = encodeURIComponent(searchQuery);
        return `https://www.google.com/maps/search/${encoded}`;
    }

    // --- HÀM RENDER NÚT GOOGLE MAPS DIRECTIONS ---
    /**
     * Render nút link Google Maps Directions (chỉ đường) với mapUrl
     * @param {string|null} mapUrl - URL Google Maps directions (null/empty = auto-generate từ places)
     * @param {Array} places - Mảng các địa điểm (dùng để tự động tạo directions URL nếu mapUrl rỗng)
     * @returns {string} - HTML string cho nút Google Maps Directions hoặc empty string
     */
    function renderDirectionsMapUrlButton(mapUrl, places) {
        let isAutoGenerated = false;

        // Tự động tạo mapUrl nếu chưa có và có places >= 2
        if (!mapUrl && places && Array.isArray(places) && places.length >= 2) {
            mapUrl = generateDirectionsMapUrl(places);
            isAutoGenerated = true;
        }

        // Không có mapUrl thì không hiển thị gì
        if (!mapUrl) {
            return '';
        }

        // Label cho mapUrl tự động (nested span với style riêng)
        const autoLabel = isAutoGenerated
            ? ' <span class="text-xs text-gray-500 italic">(Tự động tạo)</span>'
            : '';

        // Return HTML
        // Wrap text + autoLabel vào <span> để chúng luôn dính liền nhau (1 flex item)
        // Wrap SVG trong <span class="shrink-0"> để icon không bị co lại khi mobile
        return `
            <a href="${mapUrl}" target="_blank" rel="noopener noreferrer"
               class="inline-flex items-center gap-1 text-blue-600 hover:text-blue-800 hover:underline mb-2 text-sm font-medium">
                <span class="shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                </span>
                <span>Xem toàn bộ hành trình trên Google Maps${autoLabel}</span>
            </a>
        `;
    }

    // --- HÀM RENDER ICON GOOGLE MAPS CHO 1 ĐỊA ĐIỂM ---
    /**
     * Render icon Google Maps inline cho 1 địa điểm
     * @param {string} placeName - Tên địa điểm (dùng để tạo URL và tooltip)
     * @param {string} mapUrl - URL Google Maps (empty string = auto-generate)
     * @returns {string} - HTML string cho icon inline hoặc empty string
     */
    function renderPlaceMapIcon(placeName, mapUrl) {
        // Nếu không có tên địa điểm thì không render
        if (!placeName) {
            return '';
        }

        let finalUrl = mapUrl;
        let isAutoGenerated = false;

        // Tự động tạo URL nếu mapUrl là empty string
        if (!mapUrl || mapUrl === '') {
            finalUrl = generatePlaceSearchUrl(placeName);
            isAutoGenerated = true;
        }

        // Nếu không có URL (cả manual và auto) thì không render
        if (!finalUrl) {
            return '';
        }

        // Tạo tooltip text
        const tooltipText = isAutoGenerated
            ? 'Xem trên Google Maps (Tự động tạo)'
            : 'Xem trên Google Maps';

        // Return icon HTML inline
        return `<a href="${finalUrl}" target="_blank" rel="noopener noreferrer" class="place-map-icon" title="${tooltipText}"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></a>`;
    }

    // --- HÀM ĐỊNH DẠNG CHI TIẾT (Lấy từ v2.html) ---
    // Hàm này sẽ tự động tạo HTML cho mục 'details' trong JSON
    function formatDetails(details) {
        let html = '';

        // Hàm trợ giúp để render một mảng (list) hoặc một chuỗi (p)
        const renderDetail = (data) => {
            if (Array.isArray(data)) {
                return `<ul>${data.map(item => {
                    // Kiểm tra nếu item là object (có name và description)
                    if (typeof item === 'object' && item !== null) {
                        // Render map icon inline (tự động tạo URL nếu mapUrl là empty string)
                        const mapIcon = renderPlaceMapIcon(item.name, item.mapUrl || '');
                        return `<li><strong>${item.name}${mapIcon}:</strong> ${item.description}</li>`;
                    }
                    // Backward compatibility: Nếu vẫn là string
                    return `<li>${item}</li>`;
                }).join('')}</ul>`;
            }
            return `<p>${data}</p>`;
        };

        // Điều kiện hiển thị khối "Chi tiết Di chuyển":
        // 1. Có directions (bất kỳ), HOẶC
        // 2. Có places >= 2 (có thể tạo URL hành trình tự động)
        const hasDirections = details.directions;
        const canGenerateRoute = details.places && Array.isArray(details.places) && details.places.length >= 2;

        if (hasDirections || canGenerateRoute) {
            html += `<h4>Chi tiết Di chuyển</h4>`;

            // Render nút Google Maps Directions (nếu có đủ điều kiện: places >= 2)
            html += renderDirectionsMapUrlButton(
                details.directions?.mapUrl || null,
                details.places
            );

            // Render steps (chỉ khi có directions và steps)
            // Note: directions luôn có cấu trúc: { steps: string[], mapUrl?: string }
            if (hasDirections && details.directions.steps) {
                html += renderDetail(details.directions.steps);
            }
        }
        if (details.places) {
            html += `<h4>Thông tin Địa điểm</h4>${renderDetail(details.places)}`;
        }
        if (details.budgets) {
            html += renderBudget(details.budgets);
        }
        if (details.reason) {
            html += `<h4>Lý do Lựa chọn</h4><p>${details.reason}</p>`;
        }

        return html;
    }

    // --- HÀM RENDER ICON MAP CHO DAY HEADER ---
    /**
     * Render HTML cho icon map của day header (tổng quan hành trình cả ngày)
     * @param {string} mapUrl - URL Google Maps cho tổng quan cả ngày
     * @returns {string} - HTML string hoặc empty string nếu không có URL
     */
    function renderDayMapLink(mapUrl) {
        if (!mapUrl) {
            return '';
        }

        return `
            <a href="${mapUrl}" target="_blank" rel="noopener noreferrer"
               class="day-map-link"
               title="Xem tổng quan hành trình cả ngày trên Google Maps">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span>Xem bản đồ</span>
            </a>
        `;
    }

    // --- HÀM RENDER LỊCH TRÌNH (Lấy từ v2.html, chỉnh sửa HTML output) ---
    function renderTimeline(data) {
        const container = document.getElementById('timeline-container');
        container.innerHTML = ''; // Xóa nội dung cũ

        // Cập nhật tiêu đề chính
        document.getElementById('main-title').innerText = data.tripInfo.title;

        // Cập nhật subtitle với totalBudget
        let totalBudgetText = ''
        if (data.tripInfo.totalBudget) {
            totalBudgetText += ` | Chi phí: ${formatCurrency(data.tripInfo.totalBudget)}`;
        }
        document.getElementById('main-subtitle').innerText = `${data.tripInfo.subtitle} (${data.tripInfo.dates})${totalBudgetText}`;

        // Cập nhật tiêu đề của tab trình duyệt
        document.title = `${data.tripInfo.title} | Hiếu iceTea`;

        data.schedule.forEach((day, dayIndex) => {
            // ================================================================
            // === TẠO WRAPPER CONTAINER CHO MỖI NGÀY ===
            // ================================================================
            const dayContainer = document.createElement('div');
            dayContainer.className = 'timeline-day';

            // Thêm lề trên cho ngày thứ 2 trở đi
            if (dayIndex > 0) {
                dayContainer.classList.add("mt-12");
            }

            // ================================================================
            // === THÊM TIÊU ĐỀ NGÀY VÀO CONTAINER ===
            // ================================================================
            const dayHeader = document.createElement('h2');
            dayHeader.className = "text-2xl font-bold text-gray-900 mb-6 pb-2 border-b-2 border-blue-200";
            // Set nội dung: title + icon map
            const dayMapIconHTML = renderDayMapLink(day.dayInfo.mapUrl);
            dayHeader.innerHTML = `${day.dayInfo.title}${dayMapIconHTML}`;

            // Append header vào dayContainer (thay vì container chính)
            dayContainer.appendChild(dayHeader);

            // ================================================================
            // === THÊM CÁC MỤC TIMELINE VÀO CONTAINER ===
            // ================================================================
            day.timelineItems.forEach(item => {
                const itemEl = document.createElement('div');
                itemEl.className = 'timeline-item status-future'; // Mặc định là 'sắp tới'
                itemEl.dataset.startTime = item.timeInfo.startTime;
                itemEl.dataset.endTime = item.timeInfo.endTime;
                itemEl.id = `item-${item.timeInfo.startTime}`;

                const startTime = new Date(item.timeInfo.startTime);
                const endTime = new Date(item.timeInfo.endTime);

                const timeString = `${startTime.toLocaleTimeString('vi-VN', {
                    hour: '2-digit',
                    minute: '2-digit'
                })} – ${endTime.toLocaleTimeString('vi-VN', {hour: '2-digit', minute: '2-digit'})}`;

                // Tự động tính toán durationText (nếu không có trong JSON)
                const durationText = item.timeInfo.durationText || calculateDuration(item.timeInfo.startTime, item.timeInfo.endTime);

                //
                // HTML OUTPUT ĐÃ ĐƯỢC CHỈNH SỬA
                // - Dùng .timeline-line và .icon-container
                // - Dùng .timeline-card (style của index.html)
                // - Dùng nút .toggle-details (style của index.html)
                //
                itemEl.innerHTML = `
                        <!-- Đường kẻ dọc -->
                        <div class="timeline-line"></div>

                        <!-- Icon -->
                        <div class="icon-container">
                            ${getIcon(item.iconType)}
                        </div>

                        <!-- Box nội dung (Thêm class 'timeline-card' từ index.html) -->
                        <div class="timeline-card bg-white rounded-lg shadow-sm border border-gray-200 p-4 transition-all duration-300">

                            <!-- Wrapper flexbox cho 2 thời gian (1 hàng ngang, không xuống dòng) -->
                            <div class="flex justify-between items-start mb-1">
                                <!-- Thời gian chính -->
                                <time class="text-sm font-semibold text-blue-600">${timeString} ${durationText ? `(${durationText})` : ''}</time>

                                <!-- Thời gian còn lại -->
                                <!-- shrink-0: không co lại khi flex container bị thu hẹp -->
                                <p class="time-remaining text-sm font-medium text-red-600 hidden shrink-0 text-right">còn lại: --:--:--</p>
                            </div>

                            <!-- Tiêu đề (Style của index.html) -->
                            <h3 class="item-title text-lg font-semibold text-gray-900">${item.title}</h3>

                            <!-- Tóm tắt (Style của index.html) -->
                            <p class="text-sm font-normal text-gray-500 mb-2">${item.summary}</p>

                            <!-- Thời gian còn lại (Giữ từ v2) -->
                            <!-- (ĐÃ SỬA) ĐÃ BỊ DI CHUYỂN LÊN TRÊN -->
                            <!-- <p class="time-remaining text-sm font-medium text-red-600 mb-2 hidden"></p> -->

                            <!-- Nút Xem chi tiết (Style của index.html) -->
                            <button class="toggle-details text-blue-600 font-medium text-sm hover:underline inline-flex items-center mt-1">
                                <span>Xem chi tiết</span>
                                <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>

                            <!-- Nội dung chi tiết (ẩn) -->
                            <!-- (ĐÃ SỬA) Xóa class mt-3, pt-3, border-t, border-gray-200 khỏi đây -->
                            <!-- CSS sẽ tự động thêm các style này khi class 'expanded' được thêm vào -->
                            <div class="details-content">
                                ${formatDetails(item.details)}
                            </div>
                        </div>
                    `;

                // Thêm sự kiện click cho nút "Xem chi tiết" (Logic của v2)
                const toggleButton = itemEl.querySelector('.toggle-details');
                const detailsContent = itemEl.querySelector('.details-content');
                const buttonText = toggleButton.querySelector('span'); // Lấy phần text

                toggleButton.addEventListener('click', () => {
                    // Toggle class 'expanded' trên cả nút và nội dung
                    const isExpanded = detailsContent.classList.toggle('expanded');
                    toggleButton.classList.toggle('expanded'); // Để xoay icon

                    if (isExpanded) {
                        // Mở ra - Gọi helper function
                        expandTimelineItemDetails(detailsContent);
                        buttonText.innerText = 'Thu gọn';
                        itemEl.dataset.userExpanded = 'true'; // Đánh dấu người dùng MỞ
                        delete itemEl.dataset.userCollapsed;
                    } else {
                        // Thu gọn - Gọi helper function
                        collapseTimelineItemDetails(detailsContent);
                        buttonText.innerText = 'Xem chi tiết';
                        itemEl.dataset.userCollapsed = 'true'; // Đánh dấu người dùng THU GỌN
                        delete itemEl.dataset.userExpanded;
                    }
                });

                // Append timeline item vào dayContainer (thay vì container chính)
                dayContainer.appendChild(itemEl);
            });

            // ================================================================
            // === APPEND DAY CONTAINER VÀO MAIN TIMELINE CONTAINER ===
            // ================================================================
            container.appendChild(dayContainer);
        });
    }

    // --- LOGIC THỜI GIAN THỰC (Lấy 100% từ v2.html) ---
    // Đây là toàn bộ phần logic "xịn" mà bạn thích

    const timeOverrideDateInput = document.getElementById('time-override-date');
    const timeOverrideTimeInput = document.getElementById('time-override-time');
    const resetTimeButton = document.getElementById('reset-time');
    const clockDisplay = document.getElementById('real-time-clock');
    const currentActivityContainer = document.getElementById('current-activity-container');
    const currentActivityDisplay = document.getElementById('current-activity-display');
    const header = document.getElementById('header');

    let lastScrolledItemId = null; // Biến để tránh cuộn trang liên tục

    // Lấy thời gian hiện tại (hoặc thời gian giả lập)
    function getCurrentTime() {
        const dateValue = timeOverrideDateInput.value;
        const timeValue = timeOverrideTimeInput.value;

        if (dateValue && timeValue) {
            return new Date(`${dateValue}T${timeValue}`);
        } else if (dateValue) {
            const now = new Date();
            const simulatedDate = new Date(dateValue);
            simulatedDate.setHours(now.getHours());
            simulatedDate.setMinutes(now.getMinutes());
            simulatedDate.setSeconds(now.getSeconds());
            return simulatedDate;
        }
        return new Date();
    }

    // Cập nhật URL param
    function updateUrlParams() {
        // (ĐÃ SỬA LỖI)
        // Bọc toàn bộ hàm trong try...catch
        // Lỗi SecurityError xảy ra khi chạy trong một số môi trường (như blob: URL)
        // không cho phép can thiệp vào history.
        try {
            const dateValue = timeOverrideDateInput.value;
            const timeValue = timeOverrideTimeInput.value;
            const url = new URL(window.location);

            if (dateValue) {
                if (timeValue) {
                    url.searchParams.set('time', `${dateValue}T${timeValue}`);
                } else {
                    url.searchParams.set('time', dateValue);
                }
            } else {
                url.searchParams.delete('time');
            }
            window.history.pushState({}, '', url);
        } catch (e) {
            // Ghi lại lỗi một cách "nhẹ nhàng" thay vì làm crash script
            console.warn("Không thể cập nhật URL (lỗi bảo mật có thể xảy ra trong iframe/blob):", e.message);
        }
    }

    // Định dạng số (thêm số 0)
    const pad = (num) => String(num).padStart(2, '0');

    // Hàm định dạng thời gian còn lại
    function formatRemainingTime(milliseconds) {
        let totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
        // (ĐÃ SỬA) Hiển thị "Sắp kết thúc" khi còn 5 giây
        if (totalSeconds <= 5) return "Sắp kết thúc...";

        let hours = Math.floor(totalSeconds / 3600);
        totalSeconds %= 3600;
        let minutes = Math.floor(totalSeconds / 60);
        let seconds = totalSeconds % 60;

        // (ĐÃ SỬA) Thêm chữ "còn lại: "
        return `còn lại: ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    // ================================================================
    // === HELPER FUNCTIONS - Expand/Collapse Timeline Item Details ===
    // ================================================================

    /**
     * Mở rộng nội dung chi tiết của mục timeline
     * Sử dụng transitionend event và unique ID để an toàn với rapid clicks
     * @param {HTMLElement} contentEl - Element .details-content
     */
    function expandTimelineItemDetails(contentEl) {
        // Tạo unique ID cho lần expand này (timestamp + random)
        const expandId = Date.now() + Math.random();
        contentEl._currentExpandId = expandId;

        // Set scrollHeight để animation chạy mượt
        contentEl.style.maxHeight = contentEl.scrollHeight + 'px';

        // Lắng nghe transition end để set về 'none' (tự động co dãn)
        // NOTE: Không dùng { once: true } vì CSS dùng "transition: all" → nhiều properties → nhiều events
        // Phải check propertyName và manual remove listener
        function handleTransitionEnd(e) {
            // Check 4 điều kiện:
            // 1. Property là max-height (không phải margin-top, padding-top, border, etc.)
            // 2. Event từ đúng element (không phải từ children)
            // 3. Vẫn đang expanded
            // 4. Expand ID match (không bị override bởi expand khác - an toàn với rapid clicks)
            if (e.propertyName === 'max-height' && e.target === contentEl && contentEl.classList.contains('expanded') && contentEl._currentExpandId === expandId) {
                contentEl.style.maxHeight = 'none'; // Tự động co dãn khi resize
                contentEl._currentExpandId = null; // Cleanup ID
                contentEl.removeEventListener('transitionend', handleTransitionEnd); // Cleanup listener
            }
        }

        contentEl.addEventListener('transitionend', handleTransitionEnd);
    }

    /**
     * Thu gọn nội dung chi tiết của mục timeline
     * @param {HTMLElement} contentEl - Element .details-content
     */
    function collapseTimelineItemDetails(contentEl) {
        // Clear expand ID (cancel pending expand nếu có)
        contentEl._currentExpandId = null;

        // Nếu đang là 'none', chuyển về scrollHeight trước
        if (contentEl.style.maxHeight === 'none') {
            contentEl.style.maxHeight = contentEl.scrollHeight + 'px';
            contentEl.offsetHeight; // Force reflow để browser nhận giá trị mới
        }

        // Set về 0 để animation chạy
        contentEl.style.maxHeight = '0px';
    }

    // Hàm cập nhật chính, chạy mỗi giây
    function updateTimeline() {
        const now = getCurrentTime();

        // 1. Cập nhật đồng hồ
        const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        const dateStr = now.toLocaleDateString('vi-VN', {
            weekday: 'long',
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
        });
        clockDisplay.innerHTML = `
                <div class="font-mono font-bold text-2xl text-gray-900">${timeStr}</div>
                <div class="text-sm text-gray-500">${dateStr}</div>
            `;

        let currentItem = null;
        const allItems = document.querySelectorAll('.timeline-item');

        allItems.forEach(itemEl => {
            const startTime = new Date(itemEl.dataset.startTime);
            const endTime = new Date(itemEl.dataset.endTime);
            const detailsContent = itemEl.querySelector('.details-content');
            const toggleButton = itemEl.querySelector('.toggle-details');
            const buttonText = toggleButton.querySelector('span');
            const remEl = itemEl.querySelector('.time-remaining');

            // 2. Phân loại trạng thái (Quá khứ, Hiện tại, Tương lai)
            if (now >= endTime) {
                // Đã qua
                itemEl.className = 'timeline-item status-past';
                // Tự động đóng (nếu đang mở VÀ không phải do người dùng tự mở)
                if (detailsContent.classList.contains('expanded') && !itemEl.dataset.userExpanded) {
                    detailsContent.classList.remove('expanded');
                    toggleButton.classList.remove('expanded');
                    detailsContent.style.maxHeight = '0px';
                    buttonText.innerText = 'Xem chi tiết';
                }
                if (itemEl.dataset.userCollapsed) {
                    delete itemEl.dataset.userCollapsed;
                }
                remEl.classList.add('hidden');
                // (MỚI) Đảm bảo xóa cả 2 class khi mục đã trôi qua
                remEl.classList.remove('time-warning-30min', 'pulse-urgent');
            } else if (now >= startTime && now < endTime) {
                // Đang diễn ra
                itemEl.className = 'timeline-item status-current';
                currentItem = itemEl;

                // Tự động mở (nếu đang đóng VÀ người dùng CHƯA TỰ THU GỌN NÓ)
                if (!detailsContent.classList.contains('expanded') && !itemEl.dataset.userCollapsed) {
                    detailsContent.classList.add('expanded');
                    toggleButton.classList.add('expanded');
                    expandTimelineItemDetails(detailsContent); // Gọi helper function
                    buttonText.innerText = 'Thu gọn';
                }

                // Cập nhật thời gian còn lại
                const remainingMs = endTime.getTime() - now.getTime();
                const remainingSeconds = Math.floor(remainingMs / 1000); // (MỚI) Lấy số giây
                remEl.innerText = formatRemainingTime(remainingMs);
                remEl.classList.remove('hidden');

                // (ĐÃ SỬA) Logic 2 tầng cho 30 phút và 15 phút

                // 1. Dưới 30 phút (1800s)
                if (remainingSeconds < 1800 && remainingSeconds > 0) {
                    remEl.classList.add('time-warning-30min'); // Thêm class 'time-warning-30min' của Tailwind
                } else {
                    remEl.classList.remove('time-warning-30min'); // Xóa nếu trên 30 phút
                }

                // 2. Dưới 15 phút (900s)
                if (remainingSeconds < 900 && remainingSeconds > 0) {
                    remEl.classList.add('pulse-urgent'); // Thêm pulse
                } else {
                    remEl.classList.remove('pulse-urgent'); // Xóa nếu trên 15 phút
                }

            } else {
                // Sắp tới
                itemEl.className = 'timeline-item status-future';
                // Tự động đóng (nếu đang mở VÀ không phải do người dùng tự mở)
                if (detailsContent.classList.contains('expanded') && !itemEl.dataset.userExpanded) {
                    detailsContent.classList.remove('expanded');
                    toggleButton.classList.remove('expanded');
                    detailsContent.style.maxHeight = '0px';
                    buttonText.innerText = 'Xem chi tiết';
                }
                if (itemEl.dataset.userCollapsed) {
                    delete itemEl.dataset.userCollapsed;
                }
                remEl.classList.add('hidden');
                remEl.classList.remove('pulse-urgent');
                // (MỚI) Đảm bảo xóa cả time-warning-30min
                remEl.classList.remove('time-warning-30min');
            }
        });

        // 3. Cập nhật thanh Hoạt động hiện tại
        if (currentItem) {
            currentActivityDisplay.innerText = currentItem.querySelector('.item-title').innerText;
            currentActivityContainer.classList.remove('hidden'); // Hiện box

            // 4. Tự động cuộn trang (chỉ cuộn 1 lần khi mục thay đổi)
            if (currentItem.id !== lastScrolledItemId) {
                const newTargetId = currentItem.id;
                lastScrolledItemId = newTargetId;

                setTimeout(() => {
                    const currentTargetEl = document.getElementById(newTargetId);
                    if (currentTargetEl && currentTargetEl.classList.contains('status-current')) {
                        const headerHeight = header.offsetHeight;
                        const itemTop = currentTargetEl.getBoundingClientRect().top + window.scrollY;

                        window.scrollTo({
                            top: itemTop - headerHeight - 20, // 20px lề
                            behavior: 'smooth'
                        });
                    }
                }, 300);
            }
        } else {
            currentActivityContainer.classList.add('hidden'); // Ẩn box
            lastScrolledItemId = null; // Reset
        }
    }

    // --- KHỞI CHẠY ---
    document.addEventListener('DOMContentLoaded', () => {
        // Render lịch trình lần đầu
        renderTimeline(scheduleData);

        // Sự kiện cho nút Ẩn/Hiện Test Panel
        const toggleTestPanelButton = document.getElementById('toggle-test-panel');
        const testPanelContent = document.getElementById('test-panel-content');

        toggleTestPanelButton.addEventListener('click', () => {
            const isExpanded = testPanelContent.classList.toggle('expanded');
            toggleTestPanelButton.classList.toggle('expanded'); // Để xoay icon (nếu có)
            if (isExpanded) {
                testPanelContent.style.maxHeight = testPanelContent.scrollHeight + 'px';
            } else {
                testPanelContent.style.maxHeight = '0px';
            }
        });

        // Hàm xử lý khi thời gian giả lập thay đổi
        function handleSimulatedTimeChange() {
            updateTimeline();
            updateUrlParams(); // Cập nhật URL
        }

        // Sự kiện cho nút reset
        resetTimeButton.addEventListener('click', () => {
            timeOverrideDateInput.value = '';
            timeOverrideTimeInput.value = '';
            handleSimulatedTimeChange();
        });

        // Sự kiện khi thay đổi input
        timeOverrideDateInput.addEventListener('change', handleSimulatedTimeChange);
        timeOverrideTimeInput.addEventListener('change', handleSimulatedTimeChange);

        // --- XỬ LÝ PARAM TỪ URL (Lấy từ v2.html) ---
        // Giúp bạn chia sẻ link với thời gian giả lập
        // ví dụ: ...NinhBinh_v3.html?time=2025-11-15T09:30:00
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const timeParam = urlParams.get('time');

            if (timeParam) {
                const simulatedDate = new Date(timeParam);

                if (!isNaN(simulatedDate.getTime())) {
                    const dateValue = `${simulatedDate.getFullYear()}-${pad(simulatedDate.getMonth() + 1)}-${pad(simulatedDate.getDate())}`;
                    timeOverrideDateInput.value = dateValue;

                    const hasTime = /T|:| /.test(timeParam);
                    if (hasTime) {
                        const timeValue = `${pad(simulatedDate.getHours())}:${pad(simulatedDate.getMinutes())}:${pad(simulatedDate.getSeconds())}`;
                        timeOverrideTimeInput.value = timeValue;
                    }

                    // Tự động mở panel
                    if (!testPanelContent.classList.contains('expanded')) {
                        testPanelContent.classList.add('expanded');
                        toggleTestPanelButton.classList.add('expanded');
                        testPanelContent.style.maxHeight = testPanelContent.scrollHeight + 'px';
                    }
                } else {
                    console.warn("Giá trị 'time' trên URL không hợp lệ:", timeParam);
                }
            }
        } catch (e) {
            console.error("Lỗi khi xử lý URL param 'time':", e);
        }
        // --- KẾT THÚC XỬ LÝ PARAM ---

        // Bắt đầu vòng lặp cập nhật thời gian thực
        setInterval(updateTimeline, 1000); // 1 giây một lần

        // Chạy lần đầu tiên khi tải trang
        updateTimeline();
    });
</script>
